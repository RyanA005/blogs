<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5ec8d8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8a07a"/>
    </marker>
  </defs>

  <rect width="760" height="260" fill="#121820"/>
  <rect x="16" y="16" width="728" height="228" rx="8" fill="#0e141c" stroke="#243040"/>

  <text x="32" y="44" fill="#5ec8d8" font-family="Consolas, monospace" font-size="13">one CA cell update</text>
  <text x="728" y="44" fill="#7a8799" font-family="Consolas, monospace" font-size="10" text-anchor="end">Distill layout</text>

  <!-- neighborhood -->
  <g transform="translate(40, 68)">
    <rect width="108" height="108" rx="6" fill="#141c26" stroke="#243040"/>
    <text x="54" y="18" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">3x3 neighborhood</text>
    <g transform="translate(24, 30)">
      <rect x="0" y="0" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
      <rect x="22" y="0" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
      <rect x="44" y="0" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
      <rect x="0" y="22" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
      <rect x="22" y="22" width="18" height="18" fill="#243040" stroke="#5ec8d8" stroke-width="1.5"/>
      <rect x="44" y="22" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
      <rect x="0" y="44" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
      <rect x="22" y="44" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
      <rect x="44" y="44" width="18" height="18" fill="#1a2430" stroke="#2a3544"/>
    </g>
    <text x="54" y="98" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">cell x,y</text>
  </g>

  <line x1="156" y1="122" x2="188" y2="122" stroke="#5ec8d8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- perception -->
  <g transform="translate(196, 68)">
    <rect width="148" height="108" rx="6" fill="#141c26" stroke="#5ec8d8"/>
    <text x="74" y="22" fill="#e6edf5" font-size="11" text-anchor="middle" font-family="Consolas, monospace">perceive</text>
    <rect x="16" y="34" width="36" height="44" rx="4" fill="#0a1016" stroke="#2a3544"/>
    <text x="34" y="52" fill="#7a8799" font-size="8" text-anchor="middle" font-family="Consolas, monospace">id</text>
    <text x="34" y="68" fill="#7a8799" font-size="8" text-anchor="middle" font-family="Consolas, monospace">16</text>
    <rect x="56" y="34" width="36" height="44" rx="4" fill="#0a1016" stroke="#2a3544"/>
    <text x="74" y="52" fill="#7a8799" font-size="8" text-anchor="middle" font-family="Consolas, monospace">dx</text>
    <text x="74" y="68" fill="#7a8799" font-size="8" text-anchor="middle" font-family="Consolas, monospace">16</text>
    <rect x="96" y="34" width="36" height="44" rx="4" fill="#0a1016" stroke="#2a3544"/>
    <text x="114" y="52" fill="#7a8799" font-size="8" text-anchor="middle" font-family="Consolas, monospace">dy</text>
    <text x="114" y="68" fill="#7a8799" font-size="8" text-anchor="middle" font-family="Consolas, monospace">16</text>
    <text x="74" y="96" fill="#7ec8a8" font-size="10" text-anchor="middle" font-family="Consolas, monospace">48-d vector</text>
  </g>

  <line x1="352" y1="122" x2="384" y2="122" stroke="#5ec8d8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- MLP -->
  <g transform="translate(392, 68)">
    <rect width="120" height="108" rx="6" fill="#141c26" stroke="#e8a07a"/>
    <text x="60" y="22" fill="#e6edf5" font-size="11" text-anchor="middle" font-family="Consolas, monospace">MLP</text>
    <rect x="18" y="36" width="84" height="22" rx="4" fill="#0a1016" stroke="#2a3544"/>
    <text x="60" y="51" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">fc0: 48 -&gt; 128</text>
    <rect x="18" y="64" width="84" height="22" rx="4" fill="#0a1016" stroke="#2a3544"/>
    <text x="60" y="79" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">fc1: 128 -&gt; 16</text>
    <text x="60" y="102" fill="#e8a07a" font-size="10" text-anchor="middle" font-family="Consolas, monospace">delta state</text>
  </g>

  <line x1="520" y1="122" x2="552" y2="122" stroke="#e8a07a" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- update -->
  <g transform="translate(560, 68)">
    <rect width="168" height="108" rx="6" fill="#141c26" stroke="#e8a07a"/>
    <text x="84" y="22" fill="#e6edf5" font-size="11" text-anchor="middle" font-family="Consolas, monospace">apply update</text>
    <text x="84" y="52" fill="#e6edf5" font-size="11" text-anchor="middle" font-family="Consolas, monospace">x &lt;- x + dz</text>
    <text x="84" y="72" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">dz = fire * alive * delta</text>
    <g transform="translate(28, 82)">
      <rect x="0" y="0" width="14" height="10" fill="#000"/>
      <rect x="18" y="0" width="14" height="10" fill="#cc2222"/>
      <rect x="36" y="0" width="14" height="10" fill="#000"/>
      <rect x="54" y="0" width="14" height="10" fill="#334455"/>
      <rect x="72" y="0" width="14" height="10" fill="#1a2430" stroke="#2a3544"/>
      <rect x="90" y="0" width="14" height="10" fill="#1a2430" stroke="#2a3544"/>
      <text x="52" y="24" fill="#7a8799" font-size="8" text-anchor="middle" font-family="Consolas, monospace">RGBA + 12 hidden</text>
    </g>
  </g>

  <text x="380" y="206" fill="#7a8799" font-size="10" text-anchor="middle" font-family="Consolas, monospace">fire rate 0.5  |  alive mask from pooled alpha  |  same rule in train and browser</text>
</svg>
