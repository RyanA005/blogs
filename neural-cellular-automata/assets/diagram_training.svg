<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5ec8d8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8a07a"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e76f8f"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a8799"/>
    </marker>
  </defs>

  <rect width="760" height="300" fill="#121820"/>
  <rect x="16" y="16" width="728" height="268" rx="8" fill="#0e141c" stroke="#243040"/>

  <text x="32" y="44" fill="#5ec8d8" font-family="Consolas, monospace" font-size="13">training loop (PyTorch, one step)</text>

  <!-- forward path -->
  <g transform="translate(32, 64)">
    <rect width="96" height="64" rx="6" fill="#141c26" stroke="#243040"/>
    <text x="48" y="28" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">seed / pool</text>
    <text x="48" y="46" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">single cell or</text>
    <text x="48" y="58" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">best batch</text>
  </g>
  <line x1="136" y1="96" x2="160" y2="96" stroke="#5ec8d8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <g transform="translate(168, 64)">
    <rect width="112" height="64" rx="6" fill="#141c26" stroke="#5ec8d8"/>
    <text x="56" y="28" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">unroll CA</text>
    <text x="56" y="46" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">N ~ U{64, 96}</text>
    <text x="56" y="58" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">80-112 for HD</text>
  </g>
  <line x1="288" y1="96" x2="312" y2="96" stroke="#5ec8d8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <g transform="translate(320, 64)">
    <rect width="96" height="64" rx="6" fill="#141c26" stroke="#243040"/>
    <text x="48" y="32" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">predicted</text>
    <text x="48" y="48" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">RGBA state</text>
  </g>

  <text x="436" y="88" fill="#7a8799" font-size="18" text-anchor="middle" font-family="Consolas, monospace">vs</text>

  <g transform="translate(456, 64)">
    <rect width="96" height="64" rx="6" fill="#141c26" stroke="#243040"/>
    <text x="48" y="32" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">RGBA</text>
    <text x="48" y="48" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">target PNG</text>
  </g>
  <path d="M 416 96 H 430 V 84 H 584 V 96" fill="none" stroke="#e8a07a" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="560" y1="96" x2="584" y2="96" stroke="#e8a07a" stroke-width="2"/>

  <g transform="translate(592, 64)">
    <rect width="96" height="64" rx="6" fill="#141c26" stroke="#e8a07a"/>
    <text x="48" y="32" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">weighted</text>
    <text x="48" y="48" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">L2 loss</text>
  </g>

  <!-- backward + optimizer stacked under loss -->
  <g transform="translate(592, 148)">
    <rect width="96" height="64" rx="6" fill="#141c26" stroke="#e76f8f"/>
    <text x="48" y="28" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">backward</text>
    <text x="48" y="46" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">per-param</text>
    <text x="48" y="58" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">grad norm</text>
  </g>
  <line x1="640" y1="128" x2="640" y2="144" stroke="#e76f8f" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <g transform="translate(456, 148)">
    <rect width="96" height="64" rx="6" fill="#141c26" stroke="#7ec8a8"/>
    <text x="48" y="28" fill="#e6edf5" font-size="10" text-anchor="middle" font-family="Consolas, monospace">Adam step</text>
    <text x="48" y="46" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">LR 2e-3</text>
    <text x="48" y="58" fill="#7a8799" font-size="9" text-anchor="middle" font-family="Consolas, monospace">-&gt; 2e-4</text>
  </g>
  <line x1="592" y1="180" x2="560" y2="180" stroke="#7ec8a8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- feedback loop -->
  <path d="M 504 180 H 80 V 132" fill="none" stroke="#7a8799" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- persistent note -->
  <rect x="32" y="228" width="696" height="44" rx="6" fill="#0a1016" stroke="#243040" stroke-dasharray="5 4"/>
  <text x="48" y="248" fill="#7ec8a8" font-size="10" font-family="Consolas, monospace">persistent / regenerating:</text>
  <text x="48" y="262" fill="#7a8799" font-size="10" font-family="Consolas, monospace">sample pool, sort by loss, keep best batch, optional circular damage</text>

  <text x="380" y="218" fill="#7a8799" font-size="10" text-anchor="middle" font-family="Consolas, monospace">8k steps per phase  |  recipe: growing -&gt; persistent -&gt; regenerating</text>
</svg>
